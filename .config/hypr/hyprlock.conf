$font= JetBrainsMono Nerd Font
source=~/.config/hypr/mocha.conf

general {
    hide_cursor = true
    ignore_empty_input = true
    monitor = DP-1
}


animations {
   enabled = true
   bezier = linear, 1, 1, 0, 0
   animation = fadeIn, 1, 5, linear
   animation = fadeOut, 1, 5, linear
   animation = inputFieldDots, 1, 2, linear
}

background {
    monitor =
    path = /home/onni/Pictures/Wallpapers/wallpaper15.png
    blur_passes = 2
}

input-field {
    monitor = DP-1
    size = 200, 40
    outline_thickness = 2
    #inner_color = rgba(0, 0, 0, 0.0) # no fill
    inner_color = $base

    outer_color = $lavender
    check_color = $overlay2
    fail_color = $red

    font_color = $lavender
    fade_on_empty = true
    rounding = 

    font_family = $font
    placeholder_text = Password...
    fail_text = $PAMFAIL

    # uncomment to use a letter instead of a dot to indicate the typed password
    # dots_text_format = *
    # dots_size = 0.4
    dots_spacing = 0.3

    # uncomment to use an input indicator that does not show the password length (similar to swaylock's input indicator)
    # hide_input = true

    position = 0, -15
    halign = center
    valign = center
}

# TIME
label {
    monitor = DP-1
    text = $TIME # ref. https://wiki.hyprland.org/Hypr-Ecosystem/hyprlock/#variable-substitution
    font_size = 25
    font_family = $font

    position = 0, 70
    halign = center
    valign = center
    color = $lavender
}

# DATE
label {
    monitor = DP-1
    text = cmd[update:60000] date +"%A, %B %d %Y" # update every 60 seconds
    font_size = 15
    font_family = $font

    position = 0, 40
    halign = center
    valign = center
    color = $lavender
}

