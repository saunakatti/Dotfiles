"$schema" = 'https://starship.rs/config-schema.json'

add_newline = true
scan_timeout = 10

format = "$os $username[@](lavender)$hostname [in](lavender) $all $fill $time \n$character"

palette = 'catppuccin_mocha'

[os]
disabled = false
format = '[$symbol](mauve)'

[username]
format = '[$user]($style)'
show_always = true

[hostname]
ssh_only = false
format = '[$hostname](bold green)'
ssh_symbol = " "

[time]
disabled = false
format = '[  $time](surface2)'

[character]
success_symbol = '[](bold green) '
error_symbol = '[](bold red) '

[fill]
symbol = ' '

[line_break]
disabled = true

